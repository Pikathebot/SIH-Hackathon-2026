name: CI

on:
  push:
    branches: [main, productization, "phase*"]
  pull_request:
  workflow_dispatch:
    inputs:
      build_gpu_image:
        description: "Also build the GPU backend image (torch cu128, several GB)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: ruff (ruff.toml)
        run: uvx ruff@0.17.3 check .

  backend-tests:
    runs-on: ubuntu-latest
    env:
      AI_SERVICE_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - name: Install backend lock (slim, no torch)
        run: uv pip install --system -r backend/requirements.lock
      - name: pytest (mock engine)
        # Bare `pytest` would collect ai_service/rsunivlm/vendor (LLaVA); list the suites explicitly.
        run: >
          python -m pytest -q
          ai_service/common ai_service/rsunivlm/tests ai_service/fusion/tests ai_service/qwen_vl/tests
          backend/tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Audit (high and critical only)
        run: npm audit --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.cpu.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q
      - name: Build backend (slim)
        run: docker build -f backend/Dockerfile --build-arg FLAVOR=slim -t satquery-backend:slim .
      - name: Build frontend
        run: docker build -t satquery-frontend frontend
      - name: Smoke-test the CPU stack
        run: |
          docker compose -f docker-compose.yml -f docker-compose.cpu.yml up -d --wait --wait-timeout 180
          curl -fsS http://127.0.0.1:8000/api/v1/ready
          curl -fsS http://127.0.0.1:3000/ | grep -q '<div id="root"'
          curl -fsS http://127.0.0.1:3000/api/v1/health
      - name: Compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.cpu.yml logs --no-color
      - name: Build backend (gpu)
        if: ${{ inputs.build_gpu_image }}
        run: docker build -f backend/Dockerfile --build-arg FLAVOR=gpu -t satquery-backend:gpu .
