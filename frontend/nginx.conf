# SatQuery AI — frontend nginx (serves the SPA and proxies /api/ to the backend)
#
# Note: nginx only inherits add_header from the server block into a location that
# defines no add_header of its own, so /assets/ repeats the security headers.

server {
    listen 80;
    server_name localhost;
    server_tokens off;

    # Uploads stream straight through to the backend, which enforces MAX_UPLOAD_MB (4096)
    # and USER_QUOTA_MB itself. Keep this a little above MAX_UPLOAD_MB.
    client_max_body_size 4200m;

    # img-src allows https: because users may analyse images by public URL.
    # connect-src 'self' assumes the API is served from this origin under /api/
    # (the default build). If VITE_API_URL points at another origin, add it here.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;

    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;  # index.html must pick up new builds
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Vite emits content-hashed file names, so these can be cached forever
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;  # backend reuses it, so nginx and app logs line up

        # Stream multi-GB uploads instead of spooling them to nginx's disk first
        proxy_request_buffering off;
        # Queries can wait in the GPU queue and then run up to GPU_TASK_TIMEOUT_S (300 s)
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
