# Alembic config. script_location and sqlalchemy.url are set at runtime by
# app.database.alembic_config() from DATABASE_URL / DATA_DIR. The backend upgrades
# on startup; to run by hand (from backend/):  python -m app.migrate upgrade head
[alembic]
script_location = %(here)s/alembic
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
